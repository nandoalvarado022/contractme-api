services:
  mysql:
    image: mysql:8.0
    container_name: contractme-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      target: production
    container_name: contractme-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: mysql
      DB_REMOTE_HOST: mysql
      DB_REMOTE_PORT: 3306
      DB_REMOTE_DATABASE: ${MYSQL_DATABASE}
      DB_REMOTE_USERNAME: ${MYSQL_USER}
      DB_REMOTE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
