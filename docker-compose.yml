name: contractme

services:
  mysql:
    image: mysql:8.0
    container_name: contractme-mysql
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_REMOTE_DATABASE:?set DB_REMOTE_DATABASE in .env}
      MYSQL_USER: ${DB_REMOTE_USERNAME:?set DB_REMOTE_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_REMOTE_PASSWORD:?set DB_REMOTE_PASSWORD in .env}

    ports:
      - "127.0.0.1:${DB_REMOTE_PORT:-3310}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - contractme

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: contractme-api:local
    container_name: contractme-api
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: mysql
      DB_REMOTE_HOST: mysql
      DB_REMOTE_PORT: 3306

    ports:
      - "${API_HOST_PORT:-5050}:3000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - contractme

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  contractme:
