services:
  mysql:
    image: mysql:8.0
    container_name: contractme-mysql
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3310}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      disable: true

    networks:
      - contractme

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: contractme-api:local
    container_name: contractme-api
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: mysql
      DB_REMOTE_HOST: mysql
      DB_REMOTE_PORT: 3306
      DB_REMOTE_DATABASE: ${MYSQL_DATABASE}
      DB_REMOTE_USERNAME: ${MYSQL_USER}
      DB_REMOTE_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3000}:3000"

    healthcheck:
      disable: true

    depends_on:
      - mysql

    networks:
      - contractme

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  contractme:
